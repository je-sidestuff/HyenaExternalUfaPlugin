<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyena</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 2rem 1rem;
    background: #f7f1e1;
    color: #3b2a14;
  }
  main { max-width: 34rem; margin: 0 auto; }
  .card {
    background: #fffaf0;
    border: 1px solid #e0d2ae;
    border-radius: 14px;
    padding: 1.5rem 1.75rem;
    box-shadow: 0 2px 8px rgba(80, 55, 20, .12);
  }
  header { display: flex; align-items: center; gap: 1rem; }
  .logo { font-size: 2.5rem; }
  h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; }
  .tagline { margin: .15rem 0 0; color: #8a6d3b; font-size: .9rem; }
  dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: .5rem 1.25rem;
    margin: 1.5rem 0 0;
  }
  dt { color: #8a6d3b; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
  dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }
  .badge {
    display: inline-block;
    padding: .1rem .6rem;
    border-radius: 999px;
    background: #e6efd4;
    color: #3d5a14;
    font-size: .85rem;
  }
  footer { margin-top: 1.25rem; text-align: center; color: #8a6d3b; font-size: .85rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #1f1a12; color: #efe3c8; }
    .card { background: #2a2418; border-color: #4a3f29; box-shadow: none; }
    .tagline, dt, footer { color: #c4a76b; }
    .badge { background: #34431c; color: #cfe3a0; }
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <header>
      <div class="logo" aria-hidden="true">🐾</div>
      <div>
        <h1 id="msg">Hyena</h1>
        <p class="tagline">An external UFA plug-in. Ha ha ha!</p>
      </div>
    </header>
    <dl>
      <dt>App id</dt><dd id="app">-</dd>
      <dt>Served at</dt><dd id="time">-</dd>
      <dt>Origin</dt><dd id="origin">-</dd>
    </dl>
  </div>
  <footer>Served by HyenaExternalUfaPlugin</footer>
</main>
<script>
  var hello = /*HELLO*/null;
  if (hello) {
    document.getElementById('msg').textContent = hello.message;
    document.getElementById('app').textContent = hello.app_id;
    var t = new Date(hello.time);
    document.getElementById('time').textContent =
      isNaN(t) ? hello.time : t.toLocaleString() + ' (' + hello.time + ')';
  }
  // "null" here means the page is sandboxed, as external plug-ins should be.
  document.getElementById('origin').textContent = String(window.origin);
</script>
</body>
</html>
