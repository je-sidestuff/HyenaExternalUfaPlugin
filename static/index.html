<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hyena</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  pre { background: #f4f0e4; padding: 1rem; display: inline-block; }
  td { padding: .2rem .8rem .2rem 0; }
</style>
</head>
<body>
<h1 id="msg">Hyena</h1>
<pre>
 (\_/)
 (o.o)  ha ha ha
 (> <)
</pre>
<table>
  <tr><td>app id</td><td id="app"></td></tr>
  <tr><td>served at</td><td id="time"></td></tr>
  <tr><td>origin</td><td id="origin"></td></tr>
</table>
<script>
  var hello = /*HELLO*/null;
  if (hello) {
    document.getElementById('msg').textContent = hello.message;
    document.getElementById('app').textContent = hello.app_id;
    document.getElementById('time').textContent = hello.time;
  }
  // "null" here means the page is sandboxed, as external plug-ins should be.
  document.getElementById('origin').textContent = String(window.origin);
</script>
</body>
</html>
